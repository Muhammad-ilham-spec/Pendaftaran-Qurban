<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pendaftaran Qurban</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>

<body>

<div class="overlay">

    <div class="container">

        <div class="logo-circle">
            🐄
        </div>

        <h1>
            Pendaftaran
            <span>Peserta Qurban</span>
        </h1>

        <p class="subtitle">
            Lengkapi data diri untuk mendaftar
            sebagai peserta qurban.
        </p>

        <div class="form-box">

            <input
            type="text"
            id="nama"
            placeholder="Nama Peserta">

            <input
            type="text"
            id="nohp"
            placeholder="Nomor HP">

            <input
            type="text"
            id="alamat"
            placeholder="Alamat">

            <select id="jenis">
                <option value="Sapi">Sapi</option>
                <option value="Kambing">Kambing</option>
            </select>

            <input
            type="number"
            id="patungan"
            placeholder="Jumlah Patungan">

            <button onclick="tambahPeserta()">
                Daftar Sekarang →
            </button>

        </div>

        <div class="quote">

            "Maka dirikanlah shalat karena Tuhanmu,
            dan berqurbanlah."

            <br><br>

            (QS. Al-Kautsar: 2)

        </div>

    </div>

</div>

<script src="js/firebase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
