<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pendaftaran Qurban</title>
<link rel="stylesheet" href="css/style.css">

<script
src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script 
src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"
></script>

</head>
<body>
   
    <div class="container">
        <h1>Pendaftaran Peserta Qurban</h1>

        <div class="form-box">
            <input type="text" id="nama"
            placeholder="Nama Peserta">

            <input type="text" id="nohp"
            placeholder="Nomor Hp">

            <input type="text" id="alamat"
            placeholder="Alamat">

            <select id="jenis">
                <option value="Sapi">Sapi</option>
                <option value="Kambing">Kambing</option>
            </select>

            <input type="number" id="patungan"
            placeholder="Jumlah Patungan">
            
            <button onclick="tambahPeserta()">
                Daftar
            </button>
        </div>

        <div class="dashboard">

  <div class="box">

    <h2 id="totalPeserta">
      0
    </h2>

    <p>Total Peserta</p>

  </div>

  <div class="box">

    <h2 id="totalUang">
      Rp 0
    </h2>

    <p>Total Uang</p>

  </div>

</div>

        <div id="dataPeserta"></div>

    </div>

<script src="js/firebase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
